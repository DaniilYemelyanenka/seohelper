spring.application.name=seohelper

# ── PostgreSQL ────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.host=${DB_HOST:postgres}
spring.datasource.port=${DB_PORT:5432}
spring.datasource.database=${DB_NAME:seohelper_db}
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=update

# ── JWT ───────────────────────────────────────────────────────────────────────
# Обязательная переменная окружения. Сгенерировать: openssl rand -base64 48
jwt.secret=${JWT_SECRET}

# ── Google PageSpeed Insights ─────────────────────────────────────────────────
google.pagespeed.api.key=${PAGESPEED_API_KEY:}

# ── Redis ─────────────────────────────────────────────────────────────────────
spring.redis.host=${SPRING_DATA_REDIS_HOST}
spring.redis.port=${SPRING_DATA_REDIS_PORT}
spring.redis.password=${SPRING_DATA_REDIS_PASSWORD}

spring.data.redis.repositories.enabled=false
spring.redis.timeout=5000ms
spring.cache.type=redis

# ── Mail (SMTP) ───────────────────────────────────────────────────────────────
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Ollama / Spring AI ────────────────────────────────────────────────────────
spring.ai.ollama.base-url=${OLLAMA_URL}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:qwen2.5:3b}

# ── Backups ───────────────────────────────────────────────────────────────────
backup.path=${BACKUP_PATH:/backups}
